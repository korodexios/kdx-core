# korodexios-core project configuration (layer 3 of 4)
# Precedence: CLI arguments > environment variables (.env) > this file > built-in defaults.
# Every key below is optional; the shipped defaults live in
# src/korodexios_core/config/defaults.py.
core:
  name: korodexios
  log:
    level: INFO
    dir: var/log
    file: kdx.log
    file_enabled: true
    json: false
    color: true
    utc: false
    max_bytes: 1048576
    backup_count: 5
  modules:
    autodiscover: true
    enabled: []
    disabled: []
    extra_paths: []
  lifecycle:
    tick_interval: 1.0
    stop_timeout: 5.0
  ipc:
    enabled: true              # 'kdx run' opens a control plane
    host: 127.0.0.1            # 0.0.0.0 or an interface IP exposes it to the LAN
    port: 8123                 # 0 takes an ephemeral port; a busy port falls back
    timeout: 2.0               # client timeout used by 'kdx status'
    token: ""                  # static shared secret; empty means a fresh one per boot
    auth: true                 # false lets anyone on the network read /api/v1/status
    allow_anonymous_shutdown: false  # keep POST /api/v1/shutdown authenticated
  logs:
    poll_interval: 0.5         # seconds between reads for 'kdx logs --follow'
  cli:
    color: true
    interactive: true
    confirmations: true
    width: 100
  env:
    prefix: KDX

# Per-module configuration. Each module receives a scoped view of "modules.<name>".
modules:
  heartbeat:
    enabled: true
    interval: 2.0
  system_info:
    enabled: true
    disk_path: .              # filesystem reported by 'kdx system info/disk'
    include_cpu_model: true
  backup_engine:
    enabled: true
    source: .                 # what to copy; 'kdx backup plan' shows the result
    dest: var/lib/backups     # each run lands in dest/<timestamp>/
    include: ["*"]
    exclude: [".git", ".venv", "__pycache__", "var", "node_modules", "*.pyc", "*.log"]
    max_size: 500MB           # polite [!] failure when the copy would exceed this
    dry_run: false
    follow_symlinks: false
