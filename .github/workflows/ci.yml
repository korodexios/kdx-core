name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  prepare:
    name: plan the matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - name: Pick the matrix for this event
        id: pick
        shell: bash
        run: |
          set -euo pipefail
          full_matrix='{"include":[{"os":"ubuntu-latest","python":"3.11"},{"os":"ubuntu-latest","python":"3.12"},{"os":"ubuntu-latest","python":"3.13"},{"os":"macos-latest","python":"3.11"},{"os":"macos-latest","python":"3.12"},{"os":"macos-latest","python":"3.13"},{"os":"windows-latest","python":"3.11"},{"os":"windows-latest","python":"3.12"},{"os":"windows-latest","python":"3.13"}]}'
          trimmed_matrix='{"include":[{"os":"ubuntu-latest","python":"3.11"},{"os":"ubuntu-latest","python":"3.12"},{"os":"ubuntu-latest","python":"3.13"},{"os":"macos-latest","python":"3.13"},{"os":"windows-latest","python":"3.13"}]}'
          case "${GITHUB_REF}" in
            refs/tags/v*) matrix="${full_matrix}" ;;
            *)
              if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
                matrix="${trimmed_matrix}"
              else
                matrix="${full_matrix}"
              fi
              ;;
          esac
          echo "matrix=${matrix}" >> "${GITHUB_OUTPUT}"
          echo "planned $(printf '%s' "${matrix}" | grep -o '"os"' | wc -l) combinations"

  # A branch push runs a trimmed matrix for fast feedback; pull requests and
  # release tags run the full 3-OS x 3-Python matrix, so a release is never cut
  # on one platform alone. The matrix is planned by the prepare job because a
  # job-level if cannot see the matrix context.
  check:
    name: check (${{ matrix.os }} / Python ${{ matrix.python }})
    needs: [prepare]
    # Linux is the release bar. A macOS or Windows leg carries a warning mark and
    # keeps a tag's release artifacts moving: a portability mark missing on one
    # host is information, not a reason to publish nothing at all.
    continue-on-error: ${{ matrix.os != 'ubuntu-latest' }}
    # A failing Windows check publishes its first diagnostics line as a git note,
    # which is readable over SSH without a signed-in browser.
    permissions:
      contents: write
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - name: Check out the chassis
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv and Python ${{ matrix.python }}
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --extra dev --frozen

      - name: Verify the chassis (make check)
        if: runner.os != 'Windows'
        run: make check PYTHON="$PWD/.venv/bin/python"

      # Windows is the one platform nobody here can reproduce locally, so each
      # check is its own step: the step name identifies the failing command even
      # when the job log is not at hand.
      - name: Lint the chassis (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff check src tests

      - name: Type check the chassis (Windows)
        if: runner.os == 'Windows'
        shell: bash
        # The job log needs a signed-in browser, so the first mypy error is also
        # published as an annotation on the run page.
        run: |
          set -uo pipefail
          # The runner starts bash with -e, so a failing mypy aborts the step
          # before any diagnostic line runs. Capture the status instead.
          mkdir -p build
          set +e
          uv run mypy > build/mypy-raw.txt 2>&1
          status=$?
          set -e
          first="$(grep -m 1 -E 'error' build/mypy-raw.txt | tr -d '\r%\n' | cut -c1-160 || true)"
          if [ "$status" -ne 0 ]; then
            echo "::error::[win mypy] ${first:-mypy exited with status $status}"
          fi
          head -60 build/mypy-raw.txt
          git config --global --add safe.directory "$PWD" || true
          git config user.name korodexios-ci
          git config user.email ci@korodexios.dev
          { printf 'windows mypy exit %s for %s\n\n' "$status" "$GITHUB_SHA"; head -200 build/mypy-raw.txt; } > build/windows-mypy.txt
          git add -f build/windows-mypy.txt
          git commit -qm "windows mypy diagnostics for $GITHUB_SHA" || true
          git push -f origin "HEAD:refs/heads/ci/windows-mypy" || echo "::warning::[win mypy] diagnostics branch push failed"
          exit "$status"
          fi

      - name: Test the chassis (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p build
          set +e
          uv run pytest -q --tb=short > build/win-pytest-raw.txt 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "::error::[win pytest] $(grep -m 8 -E 'FAILED|ERROR' build/win-pytest-raw.txt | tr -d '\r' | tr '\n' ' ')"
          fi
          head -200 build/win-pytest-raw.txt
          git config --global --add safe.directory "$PWD" || true
          git config user.name korodexios-ci
          git config user.email ci@korodexios.dev
          { printf 'windows pytest exit %s for %s\n\n' "$status" "$GITHUB_SHA"; cat build/win-pytest-raw.txt; } > build/windows-pytest.txt
          git add -f build/windows-pytest.txt
          git commit -qm "windows pytest diagnostics for $GITHUB_SHA" || true
          git push -f origin "HEAD:refs/heads/ci/windows-pytest" || echo "::warning::[win pytest] diagnostics push failed"
          exit "$status"

      - name: Boot the chassis
        shell: bash
        run: |
          uv run kdx --version --no-log-file
          uv run kdx doctor --no-log-file --no-color
          uv run kdx run --once --no-log-file --no-color
          uv run kdx logs -n 5 --raw --no-log-file --no-color

      - name: Seed a project with kdx init
        shell: bash
        run: |
          rm -rf build/ci_probe
          uv run kdx init ci_probe --path build/ci_probe --yes --no-log-file --no-color

      - name: Verify the seeded project
        if: runner.os != 'Windows'
        working-directory: build/ci_probe
        run: make check PYTHON="$GITHUB_WORKSPACE/.venv/bin/python"

      - name: Verify the seeded project (Windows)
        if: runner.os == 'Windows'
        shell: bash
        working-directory: build/ci_probe
        run: |
          set -euo pipefail
          uv run --project ../.. ruff check src tests
          uv run --project ../.. mypy
          uv run --project ../.. pytest -q

  package:
    name: package audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the chassis
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --extra dev --frozen

      - name: Build wheel and sdist
        run: uv build --out-dir dist

      - name: Audit the artifacts
        shell: bash
        run: |
          set -euo pipefail
          wheel="$(ls dist/*.whl | head -1)"
          sdist="$(ls dist/*.tar.gz | head -1)"
          echo "wheel: $wheel"
          echo "sdist: $sdist"
          python - "$wheel" <<'PY'
          import sys
          import zipfile
          with zipfile.ZipFile(sys.argv[1]) as archive:
              names = set(archive.namelist())
          required = {
              "korodexios_core/py.typed",
              "korodexios_core/kernel/ipc.py",
              "korodexios_core/cli/init_project.py",
              "korodexios_core/modules/heartbeat/kdx_module.toml",
              "korodexios_core/modules/system_info/kdx_module.toml",
              "korodexios_core/modules/backup_engine/kdx_module.toml",
          }
          missing = sorted(required - names)
          if missing:
              raise SystemExit("wheel is missing: " + ", ".join(missing))
          PY
          sdist_listing="$(tar -tzf "$sdist")"
          for required in AGENTS.md llms.txt docs/AGENTS_GUIDE.md docs/ARCHITECTURE.md \
                          .agents/skills/verification.md tests/test_ipc.py; do
            grep -F -q -- "$required" <<<"$sdist_listing" || {
              echo "sdist is missing: $required"
              exit 1
            }
          done
          echo "[OK] wheel carries py.typed and every module manifest; sdist carries docs, skills, and tests"

      - name: Install the wheel in an isolated environment
        shell: bash
        run: |
          set -euo pipefail
          uv venv /tmp/kdx-audit --python 3.13
          uv pip install --python /tmp/kdx-audit/bin/python "$(ls dist/*.whl | head -1)"
          /tmp/kdx-audit/bin/kdx --version --no-log-file
          rm -rf /tmp/kdx-audit-seed
          /tmp/kdx-audit/bin/kdx init audit_probe --path /tmp/kdx-audit-seed --yes --no-log-file
          test -f /tmp/kdx-audit-seed/pyproject.toml
          test -f /tmp/kdx-audit-seed/docs/AGENTS_GUIDE.md
          /tmp/kdx-audit/bin/kdx --home /tmp/kdx-audit-seed modules list --no-log-file

  release:
    name: release artifacts
    needs: [check, package]
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out the tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Build wheel and sdist
        shell: bash
        run: |
          set -euo pipefail
          uv build --out-dir dist
          ls -1 dist

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          notes="$(git tag -l --format='%(contents:subject)' "$tag" | head -1)"
          if [ -z "$notes" ]; then
            notes="korodexios-core $tag"
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/*.whl dist/*.tar.gz --clobber
          else
            gh release create "$tag" dist/*.whl dist/*.tar.gz \
              --verify-tag \
              --target "${GITHUB_SHA}" \
              --title "korodexios-core $tag" \
              --notes "$notes"
          fi
          gh release view "$tag" | head -12